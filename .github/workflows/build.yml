name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write project files
        run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'__END_OF_FILE__'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MovieSubs"
          include(":app")
          __END_OF_FILE__
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'__END_OF_FILE__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END_OF_FILE__
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'__END_OF_FILE__'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          __END_OF_FILE__
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'__END_OF_FILE__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.moviesubs"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.moviesubs"
                  minSdk = 33          // needs SpeechRecognizer.EXTRA_AUDIO_SOURCE (Android 13)
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.mlkit:translate:17.0.3")
          }
          __END_OF_FILE__
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'__END_OF_FILE__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Movie Subs"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone" />
              </application>
          </manifest>
          __END_OF_FILE__
          mkdir -p "$(dirname app/src/main/java/app/moviesubs/Lang.kt)"
          cat > app/src/main/java/app/moviesubs/Lang.kt <<'__END_OF_FILE__'
          package app.moviesubs

          import com.google.mlkit.nl.translate.TranslateLanguage

          /** speechTag: tag for Android speech recognition. mlKit: ML Kit source code, or null if ML Kit can't translate it. */
          data class Lang(val label: String, val speechTag: String, val mlKit: String?)

          object Langs {
              val all = listOf(
                  Lang("Hindi", "hi-IN", TranslateLanguage.HINDI),
                  Lang("Tamil", "ta-IN", TranslateLanguage.TAMIL),
                  Lang("Telugu", "te-IN", TranslateLanguage.TELUGU),
                  Lang("Kannada", "kn-IN", TranslateLanguage.KANNADA),
                  Lang("Malayalam (needs Claude API key)", "ml-IN", null),
              )
          }
          __END_OF_FILE__
          mkdir -p "$(dirname app/src/main/java/app/moviesubs/Translators.kt)"
          cat > app/src/main/java/app/moviesubs/Translators.kt <<'__END_OF_FILE__'
          package app.moviesubs

          import android.os.Handler
          import android.os.Looper
          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.TranslatorOptions
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors

          /** Callbacks always arrive on the main thread. */
          interface SubTranslator {
              fun translate(text: String, onDone: (String?) -> Unit)
              fun close()
          }

          /** Free, on-device. Supports Hindi, Tamil, Telugu, Kannada (not Malayalam). */
          class MlKitTranslator(source: String) : SubTranslator {
              private val client = Translation.getClient(
                  TranslatorOptions.Builder()
                      .setSourceLanguage(source)
                      .setTargetLanguage(TranslateLanguage.ENGLISH)
                      .build()
              )

              fun prepare(done: (Boolean) -> Unit) {
                  client.downloadModelIfNeeded(DownloadConditions.Builder().build())
                      .addOnSuccessListener { done(true) }
                      .addOnFailureListener { done(false) }
              }

              override fun translate(text: String, onDone: (String?) -> Unit) {
                  client.translate(text)
                      .addOnSuccessListener { onDone(it) }
                      .addOnFailureListener { onDone(null) }
              }

              override fun close() = client.close()
          }

          /** Better with slang and mixed-language dialogue; needs internet and the user's own API key. */
          class ClaudeTranslator(private val apiKey: String, private val langLabel: String) : SubTranslator {
              private val exec = Executors.newSingleThreadExecutor() // single thread keeps lines in order
              private val main = Handler(Looper.getMainLooper())

              override fun translate(text: String, onDone: (String?) -> Unit) {
                  exec.execute {
                      val result = try { call(text) } catch (e: Exception) { null }
                      main.post { onDone(result) }
                  }
              }

              private fun call(text: String): String? {
                  val conn = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 15000
                      conn.doOutput = true
                      conn.setRequestProperty("content-type", "application/json")
                      conn.setRequestProperty("x-api-key", apiKey)
                      conn.setRequestProperty("anthropic-version", "2023-06-01")
                      val body = JSONObject()
                          .put("model", "claude-haiku-5-5")
                          .put("max_tokens", 300)
                          .put(
                              "system",
                              "You translate movie dialogue into natural, concise English subtitles. " +
                                  "The speech is $langLabel and may mix in English words. " +
                                  "Output only the translation: no quotes, labels or notes. " +
                                  "If the text is unclear, give your best reading."
                          )
                          .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", text)))
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      if (conn.responseCode != 200) return null
                      val resp = JSONObject(conn.inputStream.bufferedReader().readText())
                      return resp.getJSONArray("content").getJSONObject(0).getString("text").trim()
                  } finally {
                      conn.disconnect()
                  }
              }

              override fun close() { exec.shutdownNow() }
          }
          __END_OF_FILE__
          mkdir -p "$(dirname app/src/main/java/app/moviesubs/SubtitleOverlay.kt)"
          cat > app/src/main/java/app/moviesubs/SubtitleOverlay.kt <<'__END_OF_FILE__'
          package app.moviesubs

          import android.content.Context
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          /** Floating subtitle bar drawn over the movie. Touches pass through to the video. Main thread only. */
          class SubtitleOverlay(private val ctx: Context) {
              private val wm = ctx.getSystemService(WindowManager::class.java)
              private var attached = false

              private fun dp(v: Int) = (v * ctx.resources.displayMetrics.density).toInt()

              private val english = TextView(ctx).apply {
                  setTextColor(Color.WHITE)
                  textSize = 20f
                  typeface = Typeface.DEFAULT_BOLD
                  gravity = Gravity.CENTER
              }
              private val original = TextView(ctx).apply {
                  setTextColor(0xFFC8CCE0.toInt())
                  textSize = 13f
                  gravity = Gravity.CENTER
              }
              private val root = LinearLayout(ctx).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(16), dp(10), dp(16), dp(10))
                  background = GradientDrawable().apply {
                      setColor(0xB3000000.toInt())
                      cornerRadius = dp(12).toFloat()
                  }
                  addView(english)
                  addView(original)
                  visibility = View.GONE
              }

              fun show() {
                  if (attached) return
                  val lp = WindowManager.LayoutParams(
                      (ctx.resources.displayMetrics.widthPixels * 0.92f).toInt(),
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      y = dp(56)
                  }
                  wm.addView(root, lp)
                  attached = true
              }

              fun set(englishText: String, originalText: String) {
                  english.text = englishText
                  original.text = originalText
                  original.visibility = if (originalText.isBlank()) View.GONE else View.VISIBLE
                  root.visibility = if (englishText.isBlank() && originalText.isBlank()) View.GONE else View.VISIBLE
              }

              /** Shows the recognized text while its translation is still on the way. */
              fun setOriginalOnly(originalText: String) {
                  original.text = originalText
                  original.visibility = if (originalText.isBlank()) View.GONE else View.VISIBLE
                  if (originalText.isNotBlank()) root.visibility = View.VISIBLE
              }

              fun clear() = set("", "")

              fun hide() {
                  if (attached) {
                      try { wm.removeView(root) } catch (_: Exception) {}
                      attached = false
                  }
              }
          }
          __END_OF_FILE__
          mkdir -p "$(dirname app/src/main/java/app/moviesubs/CaptureService.kt)"
          cat > app/src/main/java/app/moviesubs/CaptureService.kt <<'__END_OF_FILE__'
          package app.moviesubs

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioPlaybackCaptureConfiguration
          import android.media.AudioRecord
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import java.io.IOException
          import java.util.concurrent.LinkedBlockingQueue
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.concurrent.thread

          /**
           * Pipeline: movie audio (playback capture) -> speech recognizer (fed through a pipe)
           * -> translator -> floating subtitle overlay.
           */
          class CaptureService : Service() {

              companion object {
                  const val ACTION_START = "app.moviesubs.START"
                  const val ACTION_STOP = "app.moviesubs.STOP"
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_DATA = "data"
                  const val EXTRA_LANG = "lang"
                  const val EXTRA_API_KEY = "apiKey"
                  private const val CHANNEL_ID = "capture"
                  private const val SAMPLE_RATE = 16000
                  private const val CLEAR_AFTER_MS = 6000L
              }

              private val main = Handler(Looper.getMainLooper())
              private val chunks = LinkedBlockingQueue<ByteArray>(200) // ~20 s of 100 ms chunks

              @Volatile private var running = false
              private var shutDown = false
              private var projection: MediaProjection? = null
              private var record: AudioRecord? = null
              private var overlay: SubtitleOverlay? = null
              private var translator: SubTranslator? = null
              private var lang: Lang = Langs.all[0]
              private var failures = 0
              private val clearRunnable = Runnable { overlay?.clear() }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> { shutdown(); return START_NOT_STICKY }
                      ACTION_START -> if (!running) begin(intent)
                  }
                  return START_NOT_STICKY
              }

              private fun begin(intent: Intent) {
                  startForegroundNow() // must happen before getMediaProjection on Android 14+

                  val data = intent.getParcelableExtra(EXTRA_DATA, Intent::class.java)
                  if (data == null) { shutdown(); return }
                  lang = Langs.all[intent.getIntExtra(EXTRA_LANG, 0).coerceIn(0, Langs.all.lastIndex)]
                  val apiKey = intent.getStringExtra(EXTRA_API_KEY).orEmpty()

                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  projection = mpm.getMediaProjection(intent.getIntExtra(EXTRA_RESULT_CODE, 0), data).also {
                      it.registerCallback(object : MediaProjection.Callback() {
                          override fun onStop() { main.post { shutdown() } }
                      }, main)
                  }

                  overlay = SubtitleOverlay(this).also { it.show(); it.set("Getting ready…", "") }
                  running = true

                  prepareTranslator(apiKey) { ok ->
                      if (!ok) {
                          main.postDelayed({ shutdown() }, 4000)
                      } else if (startCapture()) {
                          overlay?.set("Listening…", "")
                          main.postDelayed({ overlay?.clear() }, 2000)
                          startSession()
                      } else {
                          overlay?.set("Couldn’t capture the movie’s audio", "")
                          main.postDelayed({ shutdown() }, 4000)
                      }
                  }
              }

              private fun startForegroundNow() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, "Live subtitles", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stop = PendingIntent.getService(
                      this, 0,
                      Intent(this, CaptureService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle("Movie Subs is translating")
                      .setContentText("Tap Stop to remove the subtitles")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .addAction(Notification.Action.Builder(null, "Stop", stop).build())
                      .setOngoing(true)
                      .build()
                  // The microphone type keeps speech recognition allowed after the user switches to the movie app.
                  startForeground(
                      1, n,
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  )
              }

              private fun prepareTranslator(apiKey: String, done: (Boolean) -> Unit) {
                  when {
                      apiKey.isNotBlank() -> {
                          translator = ClaudeTranslator(apiKey, lang.label.substringBefore(" ("))
                          done(true)
                      }
                      lang.mlKit != null -> {
                          overlay?.set("Downloading translation model…", "")
                          val t = MlKitTranslator(lang.mlKit!!)
                          t.prepare { ok ->
                              if (ok) translator = t else overlay?.set("Couldn’t download the translation model. Check your connection.", "")
                              done(ok)
                          }
                      }
                      else -> {
                          overlay?.set("Malayalam needs a Claude API key. Add one in the app.", "")
                          done(false)
                      }
                  }
              }

              // ---------- audio capture ----------

              private fun startCapture(): Boolean {
                  val proj = projection ?: return false
                  return try {
                      val cfg = AudioPlaybackCaptureConfiguration.Builder(proj)
                          .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                          .addMatchingUsage(AudioAttributes.USAGE_GAME)
                          .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                          .build()
                      val fmt = AudioFormat.Builder()
                          .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                          .setSampleRate(SAMPLE_RATE)
                          .setChannelMask(AudioFormat.CHANNEL_IN_MONO)
                          .build()
                      val minBuf = AudioRecord.getMinBufferSize(
                          SAMPLE_RATE, AudioFormat.CHANNEL_IN_MONO, AudioFormat.ENCODING_PCM_16BIT
                      )
                      val rec = AudioRecord.Builder()
                          .setAudioFormat(fmt)
                          .setAudioPlaybackCaptureConfig(cfg)
                          .setBufferSizeInBytes(maxOf(minBuf, SAMPLE_RATE * 2))
                          .build()
                      rec.startRecording()
                      record = rec
                      thread(name = "audio-capture") {
                          val buf = ByteArray(3200) // 100 ms
                          while (running) {
                              val n = rec.read(buf, 0, buf.size)
                              if (n > 0) {
                                  val c = buf.copyOf(n)
                                  if (!chunks.offer(c)) { chunks.poll(); chunks.offer(c) } // drop oldest
                              } else if (n < 0) break
                          }
                      }
                      true
                  } catch (e: Exception) {
                      false
                  }
              }

              // ---------- recognition ----------
              // One recognizer session at a time, fed through a pipe (RecognizerIntent.EXTRA_AUDIO_SOURCE, Android 13+).
              // Movie audio rarely goes quiet, so the recognizer may never send a "final" result. To keep subtitles
              // flowing, the latest partial text is committed after 1.4 s without change, or after 7 s at most,
              // and a fresh session starts.

              private fun startSession() {
                  if (!running) return
                  Session().begin()
              }

              private inner class Session {
                  private val active = AtomicBoolean(true)
                  private val sr = SpeechRecognizer.createSpeechRecognizer(this@CaptureService)
                  private val pipe = ParcelFileDescriptor.createPipe()
                  private var latest = ""
                  private val quietNow = Runnable { commit() }
                  private val maxNow = Runnable { commit() }

                  fun begin() {
                      while (chunks.size > 5) chunks.poll() // keep ~0.5 s of lead-in, drop stale audio

                      thread(name = "pipe-writer") {
                          ParcelFileDescriptor.AutoCloseOutputStream(pipe[1]).use { out ->
                              try {
                                  while (active.get() && running) {
                                      val c = chunks.poll(200, TimeUnit.MILLISECONDS) ?: continue
                                      out.write(c)
                                  }
                              } catch (_: IOException) {
                              }
                          }
                      }

                      sr.setRecognitionListener(object : RecognitionListener {
                          override fun onResults(results: Bundle?) {
                              if (!active.get()) return
                              val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  ?.firstOrNull()?.takeIf { it.isNotBlank() } ?: latest
                              if (text.isNotBlank()) { failures = 0; onFinalText(text.trim()) }
                              end(100)
                          }

                          override fun onPartialResults(partialResults: Bundle?) {
                              if (!active.get()) return
                              val t = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                                  ?.firstOrNull()
                              if (t.isNullOrBlank()) return
                              val firstPartial = latest.isEmpty()
                              latest = t
                              failures = 0
                              main.removeCallbacks(clearRunnable)
                              overlay?.setOriginalOnly(t)
                              main.removeCallbacks(quietNow)
                              main.postDelayed(quietNow, 1400)
                              if (firstPartial) main.postDelayed(maxNow, 7000)
                          }

                          override fun onError(error: Int) {
                              if (!active.get()) return
                              val quiet = error == SpeechRecognizer.ERROR_NO_MATCH ||
                                  error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT
                              if (latest.isNotBlank()) onFinalText(latest.trim())
                              if (!quiet) failures++
                              if (failures >= 4) {
                                  overlay?.set("Speech recognition stopped (error $error). Trying again…", "")
                              }
                              end(if (error == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) 600 else if (quiet) 100 else 800)
                          }

                          override fun onReadyForSpeech(params: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })

                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang.speechTag)
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE, pipe[0])
                          putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE_CHANNEL_COUNT, 1)
                          putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE_ENCODING, AudioFormat.ENCODING_PCM_16BIT)
                          putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE_SAMPLING_RATE, SAMPLE_RATE)
                      }
                      sr.startListening(i)
                  }

                  private fun commit() {
                      if (!active.get()) return
                      val t = latest.trim()
                      if (t.isNotEmpty()) onFinalText(t)
                      end(100)
                  }

                  private fun end(restartDelayMs: Long) {
                      if (!active.getAndSet(false)) return
                      main.removeCallbacks(quietNow)
                      main.removeCallbacks(maxNow)
                      main.post {
                          try { sr.destroy() } catch (_: Exception) {}
                          try { pipe[0].close() } catch (_: Exception) {}
                      }
                      main.postDelayed({ startSession() }, restartDelayMs)
                  }
              }

              private fun onFinalText(text: String) {
                  main.removeCallbacks(clearRunnable)
                  overlay?.setOriginalOnly(text)
                  translator?.translate(text) { en ->
                      if (running) {
                          if (en == null) overlay?.set("Couldn’t translate this line", text) else overlay?.set(en, text)
                          main.removeCallbacks(clearRunnable)
                          main.postDelayed(clearRunnable, CLEAR_AFTER_MS)
                      }
                  }
              }

              // ---------- teardown ----------

              private fun shutdown() {
                  if (shutDown) return
                  shutDown = true
                  running = false
                  main.removeCallbacksAndMessages(null)
                  try { record?.stop() } catch (_: Exception) {}
                  try { record?.release() } catch (_: Exception) {}
                  try { projection?.stop() } catch (_: Exception) {}
                  overlay?.hide()
                  translator?.close()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  shutdown()
                  super.onDestroy()
              }
          }
          __END_OF_FILE__
          mkdir -p "$(dirname app/src/main/java/app/moviesubs/MainActivity.kt)"
          cat > app/src/main/java/app/moviesubs/MainActivity.kt <<'__END_OF_FILE__'
          package app.moviesubs

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var spinner: Spinner
              private lateinit var keyField: EditText
              private lateinit var status: TextView
              private val prefs by lazy { getSharedPreferences("moviesubs", MODE_PRIVATE) }

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { proceed() }

              private val projectionLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      val data = r.data
                      if (r.resultCode == RESULT_OK && data != null) {
                          val i = Intent(this, CaptureService::class.java).apply {
                              action = CaptureService.ACTION_START
                              putExtra(CaptureService.EXTRA_RESULT_CODE, r.resultCode)
                              putExtra(CaptureService.EXTRA_DATA, data)
                              putExtra(CaptureService.EXTRA_LANG, spinner.selectedItemPosition)
                              putExtra(CaptureService.EXTRA_API_KEY, keyField.text.toString().trim())
                          }
                          ContextCompat.startForegroundService(this, i)
                          status.text = "Subtitles are on. Open your movie. Use the notification’s Stop button to finish."
                      } else {
                          status.text = "Screen capture permission was declined. It’s needed to hear the movie’s audio."
                      }
                  }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(28), dp(20), dp(20))
                  }
                  fun add(v: android.view.View, topDp: Int = 12) {
                      col.addView(v, LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { topMargin = dp(topDp) })
                  }

                  add(TextView(this).apply { text = "Movie Subs"; textSize = 26f }, 0)
                  add(TextView(this).apply {
                      text = "Live English subtitles over any movie playing on this phone."
                      textSize = 15f
                  })

                  spinner = Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity, android.R.layout.simple_spinner_dropdown_item, Langs.all.map { it.label }
                      )
                      setSelection(prefs.getInt("lang", 0))
                  }
                  add(TextView(this).apply { text = "Movie language" }, 20)
                  add(spinner, 4)

                  keyField = EditText(this).apply {
                      hint = "Claude API key (optional)"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(prefs.getString("key", ""))
                  }
                  add(TextView(this).apply {
                      text = "Optional: a Claude API key gives better translations of slang and mixed-language dialogue, and is required for Malayalam. Without it, translation runs free on your phone."
                      textSize = 13f
                  }, 20)
                  add(keyField, 4)

                  add(Button(this).apply {
                      text = "Allow floating subtitles"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }
                  }, 20)
                  add(Button(this).apply { text = "Start subtitles"; setOnClickListener { onStartClicked() } })
                  add(Button(this).apply {
                      text = "Stop"
                      setOnClickListener {
                          startService(Intent(this@MainActivity, CaptureService::class.java).setAction(CaptureService.ACTION_STOP))
                          status.text = "Stopped."
                      }
                  })

                  status = TextView(this).apply { textSize = 14f }
                  add(status, 20)

                  setContentView(ScrollView(this).apply { addView(col) })
              }

              private fun onStartClicked() {
                  val lang = Langs.all[spinner.selectedItemPosition]
                  val key = keyField.text.toString().trim()
                  if (lang.mlKit == null && key.isBlank()) {
                      status.text = "${lang.label.substringBefore(" (")} needs a Claude API key. Add one above."
                      return
                  }
                  prefs.edit().putInt("lang", spinner.selectedItemPosition).putString("key", key).apply()

                  if (!Settings.canDrawOverlays(this)) {
                      status.text = "Tap “Allow floating subtitles”, turn it on for Movie Subs, then come back and start again."
                      return
                  }
                  val needed = listOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
                      .filter { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }
                  if (needed.isNotEmpty()) permissionLauncher.launch(needed.toTypedArray()) else proceed()
              }

              private fun proceed() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      status.text = "Microphone permission is required: Android ties capturing the movie’s audio to it."
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) return
                  val mpm = getSystemService(MediaProjectionManager::class.java)
                  projectionLauncher.launch(mpm.createScreenCaptureIntent())
              }
          }
          __END_OF_FILE__

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MovieSubs-apk
          path: app/build/outputs/apk/debug/app-debug.apk
